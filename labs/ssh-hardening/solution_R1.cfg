! task 1 - Set Hostnames & MOTD Banner
hostname R1
banner motd ^C Authorized Access Only ^C
!
! task 2 - Secure Enable & Console Access
enable secret Cisco123!
service password-encryption
line con 0
 password ConsolePass1
 login
 exec-timeout 5 0
!
! task 3 - Configure IP Addresses
interface Ethernet0/0
 ip address 192.168.10.1 255.255.255.0
 no shutdown
!
! task 4 - Prepare for SSH (RSA keys are checked from device state)
ip domain-name netlabx.local
username admin secret Cisco123!
ip ssh version 2
!
! task 5 - Restrict VTY Lines
line vty 0 4
 login local
 transport input ssh
!
end
