! task 3 - Configure Timezones and DST
clock timezone EST -5
clock summer-time EDT recurring
!
! task 5 - Configure NTP Clients (any key; task 6 adds key 1)
ntp server 192.168.13.1
!
! task 6 - NTP Authentication
ntp authenticate
ntp authentication-key 1 md5 cisco
ntp trusted-key 1
ntp server 192.168.13.1 key 1
