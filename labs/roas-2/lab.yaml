lab:
  id: roas-2
  title: "Lab 05 — Router on a Stick II"
  topic: Routing & Switching
  difficulty: Advanced
  estimated_time_minutes: 60
  objective: 'Combine multiple core CCNA concepts to build a fully functional enterprise
    branch network. Configure Inter-switch trunking, VLAN segregation, Router-on-a-stick,
    and DHCP services.

    '
  prerequisites:
  - VLANs & Trunks (802.1Q)
  - DHCP Services
  - Subinterfaces
  command_reference:
  - command: switchport mode trunk
    description: Force interface into trunking mode
  - command: switchport access vlan <id>
    description: Assign port to a VLAN
  - command: encapsulation dot1Q <vlan>
    description: Set 802.1Q tag on a subinterface
  - command: ip dhcp pool <name>
    description: Create a DHCP pool
  nodes:
  - name: R1
    kind: router
    cli_profile: ios
  - name: S1
    kind: switch
    cli_profile: ios
  - name: S2
    kind: switch
    cli_profile: ios
  - name: PC0
    kind: host
    cli_profile: vpcs
  - name: PC1
    kind: host
    cli_profile: vpcs
  - name: PC2
    kind: host
    cli_profile: vpcs
  - name: PC3
    kind: host
    cli_profile: vpcs
  tasks:
  - id: 1
    description: Inter-Switch Trunking (S1 & S2)
    instructions: 'Configure a trunk link between **S1** and **S2** to carry multiple
      VLANs.


      1. On **S1**, configure `Ethernet0/0` as a trunk.

      2. On **S2**, configure `Ethernet0/1` as a trunk.

      3. On **S2**, configure `Ethernet0/0` as a trunk (this connects to R1).

      '
    hint: Use `switchport mode trunk` on each of the interfaces listed above.
  - id: 2
    description: VLANs & Access Ports (S1)
    instructions: 'Configure **S1** for the Blue (VLAN 10) and Red (VLAN 20) departments.


      1. Create VLAN 10, VLAN 20, and VLAN 30 on **S1**.

      2. Assign `Ethernet0/1` to VLAN 10 (PC0).

      3. Assign `Ethernet0/2` to VLAN 20 (PC1).

      '
    hint: Use `vlan <id>` to create them, then `switchport mode access` and `switchport
      access vlan <id>` on the interfaces.
  - id: 3
    description: VLANs & Access Ports (S2)
    instructions: 'Configure **S2** for the Purple (VLAN 30) and Red (VLAN 20) departments.


      1. Create VLAN 10, VLAN 20, and VLAN 30 on **S2**.

      2. Assign `Ethernet0/2` to VLAN 30 (PC2).

      3. Assign `Ethernet0/3` to VLAN 20 (PC3).

      '
    hint: Ensure all VLANs exist on both switches so traffic can flow across the trunk.
  - id: 4
    description: Router-on-a-stick (R1)
    instructions: 'Configure **R1** to route between VLANs 10, 20, and 30.


      1. Enable the physical interface `Ethernet0/0`.

      2. Create subinterface `Ethernet0/0.10` for VLAN 10 (IP `192.168.10.1/24`).

      3. Create subinterface `Ethernet0/0.20` for VLAN 20 (IP `192.168.20.1/24`).

      4. Create subinterface `Ethernet0/0.30` for VLAN 30 (IP `192.168.30.1/24`).

      '
    hint: Use `encapsulation dot1Q <vlan>` before assigning the IP address.
  - id: 5
    description: DHCP Services (R1)
    instructions: 'Configure **R1** to act as a DHCP server for all three VLANs, then
      request and verify a lease on every PC.


      1. Create DHCP pool `VLAN10` for network `192.168.10.0/24` (default router `192.168.10.1`).

      2. Create DHCP pool `VLAN20` for network `192.168.20.0/24` (default router `192.168.20.1`).

      3. Create DHCP pool `VLAN30` for network `192.168.30.0/24` (default router `192.168.30.1`).

      4. After all three pools are configured, open **PC0**, **PC1**, **PC2**, and **PC3**
      and run `ip dhcp` on each PC.

      5. Run `show ip` on every PC and record each DHCP address before cross-host tests.
      Confirm that PC0 is in `192.168.10.0/24`, PC1 and PC3 are in `192.168.20.0/24`,
      and PC2 is in `192.168.30.0/24`; also confirm each PC learned its subnet gateway.

      6. Verify the learned gateways by running `ping 192.168.10.1` on PC0, `ping
      192.168.20.1` on PC1, `ping 192.168.30.1` on PC2, and `ping 192.168.20.1` on PC3.

      7. Using the DHCP addresses identified with `show ip`, ping PC2 from PC0 and PC0
      from PC2 to verify routing between VLANs 10 and 30. Then ping PC3 from PC1 and
      PC1 from PC3 to verify VLAN 20 traffic crosses the inter-switch trunk in both
      directions.

      '
    hint: Configure each pool with `ip dhcp pool <name>`, `network <ip> <mask>`, and
      `default-router <ip>`. Use `ip dhcp`, then `show ip`, on every PC before running
      the gateway and cross-host pings.
  links:
  - - S1
    - Ethernet0/0
    - S2
    - Ethernet0/1
  - - S2
    - Ethernet0/0
    - R1
    - Ethernet0/0
  - - S1
    - Ethernet0/1
    - PC0
    - Ethernet0/0
  - - S1
    - Ethernet0/2
    - PC1
    - Ethernet0/0
  - - S2
    - Ethernet0/2
    - PC2
    - Ethernet0/0
  - - S2
    - Ethernet0/3
    - PC3
    - Ethernet0/0
  checks:
  - node: PC0
    task: 5
    type: dhcp
    network: 192.168.10.0/24
    gateway: 192.168.10.1
    description: "PC0 receives a VLAN10 address and gateway through DHCP"
  - node: PC1
    task: 5
    type: dhcp
    network: 192.168.20.0/24
    gateway: 192.168.20.1
    description: "PC1 receives a VLAN20 address and gateway through DHCP"
  - node: PC2
    task: 5
    type: dhcp
    network: 192.168.30.0/24
    gateway: 192.168.30.1
    description: "PC2 receives a VLAN30 address and gateway through DHCP"
  - node: PC3
    task: 5
    type: dhcp
    network: 192.168.20.0/24
    gateway: 192.168.20.1
    description: "PC3 receives a VLAN20 address and gateway through DHCP"
  - node: PC0
    task: 5
    type: ping
    target: 192.168.10.1
    description: "PC0 (VLAN10) pings R1 VLAN10 gateway - Subinterface reachable"
  - node: PC1
    task: 5
    type: ping
    target: 192.168.20.1
    description: "PC1 (VLAN20) pings R1 VLAN20 gateway - Subinterface reachable"
  - node: PC2
    task: 5
    type: ping
    target: 192.168.30.1
    description: "PC2 (VLAN30) pings R1 VLAN30 gateway - Subinterface reachable"
  - node: PC3
    task: 5
    type: ping
    target: 192.168.20.1
    description: "PC3 (VLAN20 via S2) pings R1 VLAN20 gateway - Subinterface reachable"
  - node: PC0
    task: 5
    type: ping_node
    target_node: PC2
    description: "PC0 reaches PC2 across VLANs 10 and 30"
  - node: PC2
    task: 5
    type: ping_node
    target_node: PC0
    description: "PC2 reaches PC0 across VLANs 30 and 10"
  - node: PC1
    task: 5
    type: ping_node
    target_node: PC3
    description: "PC1 reaches same-VLAN PC3 across the inter-switch trunk"
  - node: PC3
    task: 5
    type: ping_node
    target_node: PC1
    description: "PC3 reaches same-VLAN PC1 across the inter-switch trunk"
